version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: librarydb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourPassword@123"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  api:
    build:
      context: ./LibraryManagementAPI
      dockerfile: Dockerfile
    container_name: library-api
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LibraryDB;User Id=sa;Password=YourPassword@123;TrustServerCertificate=True;
    depends_on:
      - sqlserver

volumes:
  sqldata: